name: Daily Abandoned Forms Report

on:
  schedule:
    # Runs every day at 9:00 AM UTC (Adjust if needed for your timezone)
    - cron: '0 9 * * *'
  workflow_dispatch: # This allows you to test it manually right now!

jobs:
  fetch-and-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Airtable Fetch Script
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
          AIRTABLE_TABLE_ID: ${{ secrets.AIRTABLE_TABLE_ID }}
        run: python main.py
